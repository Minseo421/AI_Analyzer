name: Java tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pr-analyzer-maven-skip-bad-repos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: pr-analyzer-maven-skip-bad-repos/pom.xml
      - name: Execute assertions
        shell: bash
        run: |
          set -o pipefail
          mvn --batch-mode clean test 2>&1 | tee maven-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            pr-analyzer-maven-skip-bad-repos/maven-test.log
            pr-analyzer-maven-skip-bad-repos/target/surefire-reports/
